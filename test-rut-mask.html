        body {
            font-family: Arial, sans-serif;

            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>

<body>

<div class="form-container">
    <!-- <form id="clientForm" onsubmit="return validateForm(event)"> -->
        <form id="clientForm"></form>
        <div class="form-group">
            <label for="rut">RUT Cliente</label>
            <input 
                type="text" 
                id="rut" 
                name="rut" 
                placeholder="12.345.678-K" 
                maxlength="12" 
                oninput="formatRUT(this)"
                required
            >
            <div id="rutError" class="error-message">El RUT ingresado no es válido.</div>
        </div>
        <button type="submit">Enviar Datos</button>
    </form>
</div>

<script>
// 1. Live RUT Masking Function
function formatRUT(input) {
    // Hide error message when user starts typing again
    document.getElementById('rutError').style.display = 'none';

    // Clean input: allow only numbers and k/K
    let value = input.value.replace(/[^0-9kK]/g, '').toUpperCase();
    
    if (value.length === 0) {
        input.value = "";
        return;
    }
    
    // Separate body and check digit (DV)
    let body = value.slice(0, -1);
    let dv = value.slice(-1);
    
    if (value.length === 1) {
        input.value = value;
        return;
    }
    
    // Format body with dots
    body = body.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    
    // Combine with hyphen
    input.value = body + "-" + dv;
}
