<script runat="server">
    Platform.Load("Core", "1.1.1");

    // 1. Configuración de parámetros de control
    var limiteConsultas = 10; 
    var deCustomerKey = "RequestsLog"; // Reemplaza con tu External Key
    var minutosVentana = 60;

    try {
        // 2. Leer la IP del cliente usando la dirección remota estándar
        ipActual = Platform.Request.ClientIP();

        // 3. Calcular la fecha y hora de hace exactamente 1 minuto en formato ISO
        var unMinutoAtras = new Date();
        // --- IMPRESIÓN POR CONSOLA DE LA CLOUDPAGE ---
        Write("<!-- unMinutoAtras: " + unMinutoAtras.toString() + " -->\n");
        // ---
        unMinutoAtras.setMinutes(unMinutoAtras.getMinutes() - 1);
        unMinutoAtras.setHours(unMinutoAtras.getHours() - 3); // Ajuste de zona horaria (-3 horas)
        var fechaFiltro = unMinutoAtras.toISOString();

        // --- IMPRESIÓN POR CONSOLA DE LA CLOUDPAGE ---
        Write("<!-- fechaFiltro: " + fechaFiltro.toString() + " -->\n");
        // ---

        var prox = new Script.Util.WSProxy();

        // 4. Construir el filtro compuesto para la base de datos
        var filter = {
            LeftOperand: {
                Property: "ipCliente",
                SimpleOperator: "equals",
                Value: ipActual
            },
            LogicalOperator: "AND",
            RightOperand: {
                Property: "fechaConsulta",
                SimpleOperator: "greaterThanOrEqual",
                Value: fechaFiltro
            }
        };

        // Solicitar únicamente el campo requestId para optimizar la velocidad
        var cols = ["requestId"];
        var req = prox.retrieve("DataExtensionObject[" + deCustomerKey + "]", cols, filter);

        var totalConsultas = 0;
        if (req != null && req.Results != null) {
            totalConsultas = req.Results.length;
        }

        // 5. Validar si excede el límite y aplicar la denegación en SSJS
        if (totalConsultas > limiteConsultas) {
            
            // Cambiamos el estado HTTP a 429 (Too Many Requests) para indicar el bloqueo
            Platform.Response.SetResponseHeader("Status", "429 Too Many Requests");
            
            Write("<h3>Acceso denegado temporalmente.</h3>");
            Write("<p>Has realizado demasiadas solicitudes en el último minuto desde la IP: <strong>" + ipActual + "</strong>.</p>");
            Write("<p>Por favor, espera un momento antes de volver a intentarlo.</p>");
            
            // Frena inmediatamente el procesamiento del resto del HTML de la CloudPage
            Platform.Response.End();
        }

    } catch (ex) {
        // En producción se deja vacío para que fallos de API no rompan la experiencia de navegación legítima
        // Write("Error: " + Stringify(ex));
    }
</script>
