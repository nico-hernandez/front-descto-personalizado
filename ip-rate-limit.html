<script runat="server">
    Platform.Load("Core", "1.1.1");

    // 1. Configuración de parámetros de control
    var limiteConsultas = 30; 
    var deCustomerKey = "RequestsLogExternalKey"; // Reemplaza con tu External Key

    try {
        // 2. Leer la IP de forma directa y exclusiva usando el método nativo de la plataforma
        var ipActual = Platform.Request.ClientIP();

        // 3. Calcular el tiempo restando 1 minuto y aplicando el ajuste de -3 horas
        var fechaFiltroObj = new Date();
        fechaFiltroObj.setMinutes(fechaFiltroObj.getMinutes() - 1); 
        fechaFiltroObj.setHours(fechaFiltroObj.getHours() - 3);     
        
        // --- IMPRESIÓN POR CONSOLA (HTML Comentarios) ---
        Write("<!-- ipActual: " + String(ipActual) + " -->\n");
        Write("<!-- fechaFiltroObj: " + String(fechaFiltroObj) + " -->\n");
        // -------------------------------------------------

        // Usamos la función nativa Format() de SFMC en lugar de toISOString()
        var fechaFiltro = Format(fechaFiltroObj, "yyyy-MM-ddTHH:mm:sszzz");

        var prox = new Script.Util.WSProxy();

        // 4. Construir el filtro compuesto para la base de datos
        var filter = {
            LeftOperand: {
                Property: "ipCliente",
                SimpleOperator: "equals",
                Value: ipActual
            },
            LogicalOperator: "AND",
            RightOperand: {
                Property: "fechaConsulta",
                SimpleOperator: "greaterThanOrEqual",
                Value: fechaFiltro
            }
        };

        var cols = ["requestId"];
        var req = prox.retrieve("DataExtensionObject[" + deCustomerKey + "]", cols, filter);

        var totalConsultas = 0;
        if (req != null && req.Results != null) {
            totalConsultas = req.Results.length;
        }

        // 5. Validar si excede el límite y aplicar la denegación en SSJS
        if (totalConsultas > limiteConsultas) {
            
            Platform.Response.SetResponseHeader("Status", "429 Too Many Requests");
            
            Write("<h3>Acceso denegado temporalmente.</h3>");
            Write("<p>Has realizado demasiadas solicitudes en el último minuto desde la IP: <strong>" + ipActual + "</strong>.</p>");
            
            Platform.Response.End();
        }

    } catch (ex) {
        // Durante pruebas puedes descomentar la siguiente línea para auditar fallos ocultos:
        // Write("<!-- Error detectado: " + Stringify(ex) + " -->");
    }
</script>
