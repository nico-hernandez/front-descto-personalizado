<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descuento personalizado</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#141414;
    --green:#1f6b3a;
    --green-dark:#123d21;
    --yellow:#f2c11f;
    --sand:#ffffff;
    --line:#141414;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--green);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    padding:24px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--sand);
    border-radius:20px;
    padding:40px 32px 32px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }

  .tag{
    display:inline-block;
    font-size:13px;
    color:var(--ink);
    font-weight:600;
    margin-bottom:14px;
    letter-spacing:0.2px;
    background:var(--yellow);
    padding:3px 10px;
    border-radius:20px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-size:30px;
    line-height:1.15;
    margin:0 0 10px;
    color:var(--green-dark);
  }

  p.sub{
    margin:0 0 28px;
    font-size:15px;
    line-height:1.5;
    color:#3f3f3f;
  }

  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--green-dark);
  }

  .field{
    margin-bottom:18px;
  }

  input[type="text"], input[type="tel"]{
    width:100%;
    padding:13px 14px;
    font-size:15px;
    font-family:'Inter', sans-serif;
    border:1.5px solid var(--green);
    border-radius:12px;
    background:#fffdf9;
    color:var(--ink);
    outline:none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus, input[type="tel"]:focus{
    border-color: var(--yellow);
    box-shadow: 0 0 0 3px rgba(242,193,31,0.35);
  }

  button{
    width:100%;
    margin-top:8px;
    padding:15px;
    font-size:16px;
    font-weight:600;
    font-family:'Inter', sans-serif;
    background:var(--green);
    color:#ffffff;
    border-radius:12px;
    cursor:pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }

  button:hover{
    background:var(--green-dark);
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    transform: translateY(-1px);
  }

  button:active{
    transform: translateY(0);
    box-shadow:none;
  }

  .fine{
    margin-top:16px;
    font-size:12px;
    color:#8a8071;
    text-align:center;
  }

  .result{
    display:none;
    text-align:center;
    padding:12px 0 4px;
  }

  .result.show{
    display:block;
  }

  .result .icon{
    font-size:34px;
    margin-bottom:8px;
  }

  .result h2{
    font-family:'Fraunces', serif;
    font-size:22px;
    margin:0 0 6px;
    color:var(--green-dark);
  }

  .result p{
    font-size:14px;
    color:#3f3f3f;
    margin:0 0 18px;
  }

  .code-box{
    background:var(--yellow);
    border:2px dashed var(--ink);
    border-radius:12px;
    padding:14px;
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--ink);
    margin-bottom:20px;
  }

  form.hide{
    display:none;
  }
</style>
</head>
<body>

  <div class="card">
    <span class="tag">Exclusivo Club</span>
    <h1 id="mainTitle">Descubre si tienes un descuento personalizado</h1>
    <p class="sub" id="mainSub">Ingresa tus datos y descubre si hay un beneficio especial esperando por ti.</p>

    <form id="discountForm">
      <div class="field">
        <label for="rut">RUT</label>
        <input type="text" id="rut" name="rut" placeholder="12.345.678-9" required>
      </div>

      <div class="field">
        <label for="telefono">Número de teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678" required>
      </div>

      <button type="submit" id="submitBtn">Probar ZSuerte</button>
    </form>

    <div class="result" id="resultBox">
      <div class="icon">🎉</div>
      <h2>¡Tienes un descuento!</h2>
      <p>Usa este código en tu próxima compra</p>
      <div class="code-box" id="discountCode">CLUB2026</div>
      <button type="button" id="retryBtn">Consultar otro RUT</button>
    </div>

    <p class="fine" id="fineText">Tus datos se usan solo para calcular tu descuento.</p>
  </div>

  <script>
    const form = document.getElementById('discountForm');
    const resultBox = document.getElementById('resultBox');
    const retryBtn = document.getElementById('retryBtn');
    const discountCode = document.getElementById('discountCode');
    const rutInput = document.getElementById('rut');
    const telInput = document.getElementById('telefono');

    function generarCodigo(){
      const random = Math.floor(1000 + Math.random() * 9000);
      return 'CLUB' + random;
    }

    form.addEventListener('submit', function(e){
      e.preventDefault();
      discountCode.textContent = generarCodigo();
      form.classList.add('hide');
      resultBox.classList.add('show');
    });

    retryBtn.addEventListener('click', function(){
      rutInput.value = '';
      telInput.value = '';
      resultBox.classList.remove('show');
      form.classList.remove('hide');
    });
  </script>

</body>
</html>
